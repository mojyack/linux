%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/nintendo,switch-panel.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nintendo Switch 6.2" 720x1280 DSI video mode panel

maintainers:
  - mojyack <mojyack@gmail.com>

description:
  The four-lane DSI video mode LCD of the Nintendo Switch (HAC-001). Consoles
  were assembled with panels from several families, all built around a Himax
  HX8394 controller but each family needing its own power-up and power-down
  sequence - JDI LPM062M326A and LAM062M109A, InnoLux P062CCA (AZ1, AZ2) and
  AUO A062TAN (00, 01, 02). Which one a console carries is not recorded
  anywhere the board description could use, so this compatible describes the
  assembly and the panel is identified at runtime by its DCS display ID.

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    const: nintendo,switch-panel

  reg:
    maxItems: 1

  vddi-supply:
    description: Logic and I/O supply (1.8 V).

  avdd-supply:
    description: Positive analog supply (+5.4 V).

  avee-supply:
    description: Negative analog supply (-5.4 V).

  reset-gpios:
    maxItems: 1
    description:
      Panel reset, active low. The power-up sequence pulses it before the
      display ID is read.

  backlight: true

required:
  - compatible
  - reg
  - vddi-supply
  - avdd-supply
  - avee-supply
  - reset-gpios

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "nintendo,switch-panel";
            reg = <0>;

            reset-gpios = <&gpio 170 GPIO_ACTIVE_LOW>;
            vddi-supply = <&vdd_1v8>;
            avdd-supply = <&pavdd>;
            avee-supply = <&navdd>;
            backlight = <&backlight>;
        };
    };
...
