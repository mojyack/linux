%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/light/rohm,bh1730fvc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ROHM BH1730FVC ambient light sensor

maintainers:
  - mojyack <mojyack@gmail.com>

description: |
  I2C ambient light sensor with a visible and an infrared channel, a
  programmable gain, a programmable integration time and an open-drain
  threshold interrupt output.

  Datasheet: https://fscdn.rohm.com/en/products/databook/datasheet/ic/sensor/light/bh1730fvc-e.pdf

properties:
  compatible:
    const: rohm,bh1730fvc

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  vcc-supply:
    description: Power supply, VCC pin.

  dvi-supply:
    description: I2C bus I/O voltage, DVI pin.

required:
  - compatible
  - reg
  - vcc-supply
  - dvi-supply

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        light-sensor@29 {
            compatible = "rohm,bh1730fvc";
            reg = <0x29>;
            interrupt-parent = <&gpio>;
            interrupts = <17 IRQ_TYPE_LEVEL_LOW>;
            vcc-supply = <&vcc_3v0>;
            dvi-supply = <&vcc_1v8>;
        };
    };
...
