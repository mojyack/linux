%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/light/rohm,bh1730fvc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ROHM BH1730FVC ambient light sensor

maintainers:
  - mojyack <mojyack@gmail.com>

description:
  I2C ambient light sensor with a visible and an infrared channel, a
  programmable gain and a programmable integration time. The device has no
  interrupt output.

properties:
  compatible:
    const: rohm,bh1730fvc

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        light-sensor@29 {
            compatible = "rohm,bh1730fvc";
            reg = <0x29>;
        };
    };
...
